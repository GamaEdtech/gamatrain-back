name: Build and Deploy ASP.Net Core app to VPS - GamaEdtech

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build Rest API Project
        run: |
          cd src
          dotnet build --configuration Release

      - name: Publish Rest API Project
        run: |
          cd src
          dotnet publish --configuration Release -o app

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: src/app

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to VPS via SSH
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: '.'
          target: '/var/www/gamaapp'

      - name: Restart application on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/gamaapp
            # The scp step above deploys as VPS_USER (ubuntu), but the service itself runs as
            # www-data (systemctl show gamaapp.service -p User) with no write access to that
            # user's files - so any directory the app creates at runtime (Serilog's file sink,
            # GlobalService.GenerateSiteMapAsync's wwwroot/sitemap) silently fails to be created
            # otherwise, with Serilog swallowing its own sink errors and GenerateSiteMapAsync
            # logging an UnauthorizedAccessException every run. Ensuring both exist with the
            # right ownership on every deploy, not just once by hand, is what actually prevents
            # this regressing - see docs/deployment/overview.md.
            sudo mkdir -p logs wwwroot/sitemap
            sudo chown -R www-data:www-data logs wwwroot/sitemap
            sudo systemctl restart gamaapp.service
