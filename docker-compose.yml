# Local stack: SQL Server + Redis + the API, ready to use after one command:
#
#   docker compose up -d --build
#
# The API applies every pending EF migration itself on start (Common.Hosting.Host -> MigrateAsync), so an empty
# database becomes a full one with no manual step; the first boot takes a few minutes for that. Then:
#   Swagger  http://localhost:7000/swagger     Health  http://localhost:7000/health
# Logs: `docker compose logs -f api`. App settings (core address, JWT key, MCP, CORS…) are in .env next to this file;
# anything it doesn't set comes from src/Presentation/Api/appsettings.json.

name: gamatrain-back

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Gamatrain_Local_1}
      MSSQL_MEMORY_LIMIT_MB: 2048
    ports:
      - "${DB_PORT:-14330}:1433"
    volumes:
      - mssql:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:alpine
    volumes:
      - redis:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Any name without an appsettings.<name>.json: "Development" turns on strict DI scope validation, which the
      # app does not pass (docs/development/testing.md).
      ASPNETCORE_ENVIRONMENT: Docker
      Connection__ConnectionString: Server=db,1433;Database=GamaEdtech;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Gamatrain_Local_1};TrustServerCertificate=True
      Cache__Configuration: redis:6379,abortConnect=False
      # Also log to stdout, for `docker compose logs`.
      Serilog__Using__5: Serilog.Sinks.Console
      Serilog__WriteTo__1__Name: Console
      Serilog__MinimumLevel__Override__Microsoft.Hosting.Lifetime: Information
    # Lets CORE_URL point at the host's local gama (http://host.docker.internal/gama).
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${API_PORT:-7000}:8080"
    volumes:
      - files:/app/wwwroot/Files
      - sitemap:/app/wwwroot/sitemap
      - logs:/app/logs
      - chrome:/home/app/chrome
    restart: unless-stopped

volumes:
  mssql:
  redis:
  files:
  sitemap:
  logs:
  chrome:
